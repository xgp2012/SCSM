name: Go Build & Release

# Builds the SCNETM panel as a self-contained Linux x86-64 binary and publishes
# it as a GitHub release.
#
# # How a release is produced
#
# You do not create tags by hand. Pushing to main is enough:
#
#   1. `verify`   — fmt, vet, test. Nothing else starts until this is green.
#   2. `release`  — computes the next patch version from the highest existing
#                   v* tag, creates that tag, and pushes it.
#   3. `build`    — checks out the tag the release job just made, builds, and
#                   creates the release from it.
#
# A commit that fails verification produces no tag and no release.
#
# # Five things about this project make the ordering below load-bearing
#
#   1. The frontend must be built and copied into internal/webui/dist BEFORE
#      `go build` runs. go:embed cannot reference ../../web/dist, so the binary
#      embeds whatever happens to sit in internal/webui/dist at compile time.
#      A bare `go build` on a clean checkout therefore succeeds with exit code 0
#      while embedding a placeholder page — a silent failure that looks green.
#      The "Verify frontend is embedded" step below turns that into a hard error.
#   2. CGO is disabled. The SQLite driver is modernc.org/sqlite, a pure-Go
#      translation, so the result is a static binary with no libc/libsqlite3
#      dependency.
#   3. Release notes are written from body_path, NOT generate_release_notes.
#      That feature summarises merged pull requests and lists contributors; this
#      repository has no PRs and a linear history, so it emits a single
#      "Full Changelog" line and nothing else. Measured on the v0.2.0 release:
#      66 bytes of body. RELEASE_NOTES.md is generated below instead.
#   4. The tag must match the version compiled into the binary. VERSION comes
#      from GITHUB_REF_NAME and a step asserts --version reports exactly that
#      string, so a v0.3.0 release can never ship a binary that says something
#      else.
#
#      THIS IS WHY THE TAG MUST EXIST BEFORE THE BUILD. On a branch push
#      GITHUB_REF_NAME is "main", so building first and tagging afterwards would
#      compile the literal string "main" into the binary and then fail the
#      assertion on every run. The `release` job therefore creates the tag and
#      `build` checks that tag out, so GITHUB_REF_NAME is the version.
#   5. Auto-tagging and the checkout are both pinned to the workflow's own
#      commit (github.sha), never to the moving `main` ref: several pushes can
#      be in flight at once, and checking out `main` would silently build
#      someone else's newer commit under this run's tag.
#   6. THE RELEASE JOB MUST NOT RUN CONCURRENTLY WITH ITSELF. Version numbers
#      are computed from the highest existing tag, so two runs starting together
#      both read the same "latest" and both believe the next version is free.
#      The "HEAD is already tagged" check does not save you: it reads before it
#      writes, so both runs pass the check and then create v0.2.1 AND v0.2.2
#      against the same commit — two releases for one change, and a version
#      number burned. The concurrency group below serialises them; combined with
#      that check, the second run finds HEAD already tagged and exits cleanly.
#
#      cancel-in-progress is false on purpose: cancelling a run midway through
#      could leave a tag pushed with no release attached to it.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # Releases are produced from main only. Feature branches still run `verify`
    # so a regression is caught before it reaches main, but they neither tag nor
    # upload artifacts.
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Build without creating a new tag or release'
        type: boolean
        default: false

# Workflow-level permissions are the least privilege a build needs. The release
# job raises its own to contents:write, because creating a tag and a release
# needs write access that a build must not have. Declaring contents:read for the
# whole workflow and then pushing a tag without elevating is a silent trap: the
# build goes green and only the tag step fails with "Resource not accessible by
# integration".
permissions:
  contents: read

env:
  # Keep this in step with the `go` directive in go.mod.
  GO_VERSION: '1.27.1'
  NODE_VERSION: '22'
  # Left unset on purpose: pnpm/action-setup reads `packageManager` from
  # web/package.json, so the version is declared in exactly one place.

jobs:
  # ---- Fast feedback: Go static analysis and tests, no Node involved --------
  # Split out so a Go regression fails in ~1 minute instead of waiting behind
  # the frontend dependency install and Vite build.
  verify:
    name: Verify (fmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # ---- Create the version tag ----------------------------------------------
  # Only runs on a push to main, and only after verify is green, so a commit
  # that fails fmt/vet/test produces no tag and no release.
  #
  # The next version is the highest existing v* tag with its patch component
  # incremented: v0.2.0 -> v0.2.1. Version sorting is done by `sort -V` rather
  # than lexically, because v0.10.0 must sort above v0.9.0.
  release:
    name: Tag version
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.skip_release != true
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # All tags are needed to compute the next version, so a shallow clone
          # is not enough.
          fetch-depth: 0

      - name: Compute and push the next tag
        id: tag
        run: |
          set -euo pipefail

          # --- find the highest existing version tag ---
          latest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
            echo "No existing tags; starting at ${next}"
          else
            echo "Latest tag: ${latest}"
            # Split on dots. The leading v is stripped from the major component.
            # A non-numeric component means a hand-made tag (e.g. v0.1.0-rc1)
            # got picked up; fail loudly rather than computing nonsense.
            IFS='.' read -r major minor patch <<< "${latest#v}"
            if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot parse ${latest} as vMAJOR.MINOR.PATCH"
              exit 1
            fi
            next="v${major}.${minor}.$((patch + 1))"
          fi

          # --- re-read the remote before deciding ---
          # The version above was computed from the tags present at checkout
          # time. The concurrency group means a second run should not be here at
          # all, but a tag pushed by a human (or by a run that started before
          # this one acquired the lock) would otherwise be invisible and the
          # computation would be based on stale data. Fetching tags by
          # --prune-tags keeps this decision on current remote state.
          git fetch --tags --force --prune-tags origin >/dev/null 2>&1 || true

          # Recompute against what the remote actually has now.
          latest_remote="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -n "$latest_remote" ] && [ "$latest_remote" != "$latest" ]; then
            echo "Remote is ahead of the checkout: latest is now ${latest_remote} (was ${latest})"
            IFS='.' read -r major minor patch <<< "${latest_remote#v}"
            if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot parse ${latest_remote} as vMAJOR.MINOR.PATCH"
              exit 1
            fi
            next="v${major}.${minor}.$((patch + 1))"
            echo "Recomputed next version: ${next}"
          fi

          # --- is this commit already tagged? ---
          # Several pushes can be in flight, and a re-run is possible. If HEAD
          # is already carrying a version tag there is nothing to do; treating
          # that as success (rather than an error) keeps a re-run idempotent.
          # This is also what makes the serialised second run a no-op rather
          # than a duplicate release.
          head_sha="$(git rev-parse HEAD)"
          existing="$(git tag --points-at "$head_sha" | grep -E '^v[0-9]' || true)"
          if [ -n "$existing" ]; then
            tag="$(printf '%s\n' "$existing" | sort -V | tail -1)"
            echo "HEAD is already tagged ${tag}; reusing it."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- refuse to move an existing tag ---
          # Tags are immutable releases. If the computed name already exists,
          # something is out of order (a concurrent run, most likely) and
          # silently overwriting would rewrite published history.
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::tag ${next} already exists but does not point at HEAD; refusing to move it"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${next}" -m "SCNETM ${next}" "$head_sha"

          # Push the tag alone, by name, so nothing else can be moved by this
          # command. The token comes from the checkout's persisted credentials.
          git push origin "refs/tags/${next}"

          echo "Created and pushed ${next} at ${head_sha}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # ---- Assemble the release binary -----------------------------------------
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    needs: [verify, release]
    # `release` is skipped on PRs, branch pushes and workflow_dispatch with
    # skip_release, so this must tolerate it being skipped. Without
    # always(), a skipped dependency would skip the build too, and a PR would
    # never get its compile check.
    if: always() && needs.verify.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    # Elevated from the workflow-level contents:read so the release step can
    # create a release and upload assets.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # internal/version reads vcs.revision via debug.ReadBuildInfo, so the
          # binary wants a real git history to report an accurate commit.
          fetch-depth: 0
          # When the release job made a tag, build THAT tag. Otherwise
          # GITHUB_REF_NAME is "main" and the version assertion below would
          # compare "main" against the tag and fail on every run.
          #
          # github.sha (not `main`) pins this to the commit this run was
          # triggered by, so a concurrent push cannot make this run tag one
          # commit and build another.
          ref: ${{ needs.release.outputs.tag || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up pnpm
        # The version comes from web/package.json's `packageManager` field.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # ---- Release gate: race detector (tags only) ---------------------------
      # Race detection is the expensive check, so it runs only when a release is
      # actually being cut. supervisor and ansi are the concurrency-heavy
      # packages; a data race there corrupts the console stream under load.
      #
      # Keyed off the release job rather than github.ref: after this change a
      # release is cut by a push to main, where github.ref is not a tag ref.
      # A tag push (the manual escape hatch) sets neither output, so it is
      # covered by the second clause.
      - name: go test -race (release gate)
        if: needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: go test -race ./...

      # ---- Frontend ----------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        # package.json's build script runs `pnpm type-check && vite build`, so a
        # type error fails here rather than surfacing as a broken page later.
        run: pnpm run build

      # ---- Assemble the binary ----------------------------------------------
      # `make build` performs the web/dist -> internal/webui/dist copy and then
      # compiles with CGO_ENABLED=0 and the version ldflags.
      #
      # VERSION is taken from the tag the release job produced when there is
      # one, and falls back to GITHUB_REF_NAME (a v* tag push, or any ref for a
      # non-release build) otherwise. This must agree with the assertion below.
      - name: Build binary
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.tag }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "Building version: ${version}"
          make build \
            VERSION="${version}" \
            COMMIT="${GITHUB_SHA}" \
            BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify frontend is embedded
        # Guards the silent-placeholder failure described in the header comment.
        #
        # This must be a *behavioural* check. Grepping the binary for a marker
        # does not work: the placeholder page and its ErrNotBuilt message are
        # compiled into every build, so the string "frontend not built" is
        # present whether or not a real UI was embedded. Instead, start the
        # panel and assert that "/" serves the real index.html.
        run: |
          set -uo pipefail
          rm -rf verify-data
          ./build/scnetm --listen 127.0.0.1:3998 --data-dir "$PWD/verify-data" > verify.log 2>&1 &
          pid=$!
          served=""
          for _ in $(seq 1 30); do
            if served="$(curl -fsS http://127.0.0.1:3998/ 2>/dev/null)"; then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          echo "----- verify.log -----"; cat verify.log || true

          if printf '%s' "$served" | grep -q 'frontend not built'; then
            echo "::error::binary serves the placeholder page — the frontend was not copied into internal/webui/dist before go build"
            exit 1
          fi
          if ! printf '%s' "$served" | grep -q 'SCNETM'; then
            echo "::error::GET / did not return the panel frontend (got: ${served:0:200})"
            exit 1
          fi
          echo "Frontend is embedded and served correctly."

      - name: Report binary details
        run: |
          file build/scnetm
          ls -lh build/scnetm
          ./build/scnetm --version

      - name: Verify the release version matches the binary
        # The version compiled into the binary must equal the tag the release is
        # published under. Keyed off the release job's output rather than
        # github.ref: on a push to main this run is a branch build that the
        # release job turned into a tag, and github.ref still says main here in
        # the workflow_dispatch and PR cases.
        if: needs.release.outputs.created == 'true'
        run: |
          set -euo pipefail
          tag="${{ needs.release.outputs.tag }}"
          built="$(./build/scnetm --version | head -1 | awk '{print $2}')"
          echo "tag=${tag} binary=${built}"
          if [ "$built" != "${tag}" ]; then
            echo "::error::binary reports version '${built}' but the tag is '${tag}'"
            exit 1
          fi
          echo "Release version matches the tag."

      # ---- Smoke test --------------------------------------------------------
      # /healthz is deliberately unauthenticated and dependency-light: it must
      # answer on a host with no .NET runtime and no game-server package, which
      # is exactly this runner. That makes "does it bind and serve" checkable.
      - name: Smoke test binary
        run: |
          set -uo pipefail
          rm -rf smoke-data smoke.log
          ./build/scnetm --listen 127.0.0.1:3999 --data-dir "$PWD/smoke-data" > smoke.log 2>&1 &
          pid=$!
          echo "started pid=$pid on 127.0.0.1:3999"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/healthz -o health.json; then
              ok=1; echo "answered /healthz after ${i}s"; break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::binary exited during startup"; break
            fi
            sleep 1
          done

          # Collect diagnostics before killing, so a failure keeps its evidence.
          if [ "$ok" -ne 1 ]; then
            echo "===== process ====="
            kill -0 "$pid" 2>/dev/null && echo "still alive but not serving" || echo "gone"
            echo "===== listening sockets ====="
            (ss -ltnp 2>/dev/null || true) | grep ':3999' || echo "3999 not listening"
            echo "===== raw response ====="
            curl -sS -i http://127.0.0.1:3999/healthz 2>&1 | head -20 || true
          fi

          kill "$pid" 2>/dev/null || true
          for _ in $(seq 1 15); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          echo "===== smoke.log ====="
          cat smoke.log || true

          [ "$ok" -eq 1 ] || { echo "::error::/healthz did not answer within 30s"; exit 1; }
          grep -q '"status":"ok"' health.json || { echo "::error::unexpected /healthz body"; cat health.json; exit 1; }
          echo "Smoke test passed."

      # ---- Package -----------------------------------------------------------
      - name: Package release tarball
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp build/scnetm dist/scnetm-linux-amd64

          # Assemble a tarball an operator can unpack and run. config.example.yaml
          # and the systemd unit are part of the deployment story, so their
          # absence is an error rather than something to skip quietly.
          stage="$(mktemp -d)"
          cp build/scnetm "$stage/scnetm"
          cp configs/config.example.yaml "$stage/config.example.yaml"
          cp deployments/scnetm.service "$stage/scnetm.service"
          cp docs/README.md "$stage/README.md"
          tar -C "$stage" -czf dist/scnetm-linux-amd64.tar.gz \
            scnetm config.example.yaml scnetm.service README.md
          rm -rf "$stage"

          # Checksums, so a download can be verified independently of TLS.
          ( cd dist && sha256sum scnetm-linux-amd64 scnetm-linux-amd64.tar.gz > SHA256SUMS )

          echo "----- dist -----"
          ls -lh dist
          cat dist/SHA256SUMS

      # ---- Release notes -----------------------------------------------------
      # Written from a template, not generated from PRs (see header note 3).
      # Every claim below is asserted against the real artefact or taken from
      # the docs; nothing here is aspirational. The known-limitations section is
      # deliberately blunt: docs/验证报告.md grades each conclusion A/B/C/D and
      # forbids promoting a B or C to A, so the release note echoes that.
      - name: Generate release notes
        if: needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.tag }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "Writing notes for ${version}"
          short_sha="$(git rev-parse --short HEAD)"
          size="$(du -h dist/scnetm-linux-amd64 | cut -f1)"
          sha="$(awk '$2=="scnetm-linux-amd64"{print $1}' dist/SHA256SUMS)"
          # Publishing an empty checksum would be worse than failing: the release
          # note is the one place a user is told what to expect. The packaging
          # step already wrote this line, so an empty value means something
          # upstream changed and the operator needs to know.
          if [ -z "$sha" ]; then
            echo "::error::could not read scnetm-linux-amd64 from dist/SHA256SUMS"
            cat dist/SHA256SUMS
            exit 1
          fi

          # Previous tag, so the changelog is a real range rather than a link.
          prev="$(git describe --tags --abbrev=0 "${version}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="${prev}..${version}"
          else
            range="${version}"
          fi

          {
            echo "SCNETM 面板 ${version} — Linux x86-64 静态二进制（$size）。"
            echo
            echo "## 下载"
            echo
            echo '| 文件 | 说明 |'
            echo '|---|---|'
            echo '| `scnetm-linux-amd64` | 裸二进制，可直接运行 |'
            echo '| `scnetm-linux-amd64.tar.gz` | 含二进制、`config.example.yaml`、`scnetm.service`、`README.md` |'
            echo '| `SHA256SUMS` | 上述两个文件的校验和 |'
            echo
            echo "## 校验"
            echo
            echo '```bash'
            echo "curl -sSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/SHA256SUMS"
            echo "curl -sSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/scnetm-linux-amd64"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "本二进制 \`scnetm-linux-amd64\` 的 SHA-256：\`${sha}\`"
            echo
            echo "## 运行"
            echo
            echo '```bash'
            echo "./scnetm-linux-amd64 --listen 0.0.0.0:7000 --data-dir /srv/scnetm"
            echo '```'
            echo
            echo "首次启动会建库并迁移，然后访问 \`/healthz\` 确认存活。"
            echo "默认监听 \`0.0.0.0:7000\`（**面板自身无 TLS**，公网暴露前请在前面加反向代理终止 TLS）。"
            echo
            echo "## 环境要求"
            echo
            echo "- **面板本身**：无需 .NET、无需游戏服务端，任何 Linux x86-64 均可启动。"
            echo "- **启动游戏实例**：需要 .NET 10 运行时（\`Microsoft.NETCore.App\`，**不是** SDK）"
            echo "  与解包后的服务端发行物（\`Survivalcraft.dll\`、\`Content.scpak\`），"
            echo "  用 \`template_dir\` 指向后者。二者缺失时面板照常运行，只有启动实例会报错。"
            echo
            echo "## 已知限制"
            echo
            echo "以下为**未经运行时验证**的部分，请勿当作已确认能力："
            echo
            echo "- **PTY 彩色输出与指令通道未验证**。服务端只有在真实 PTY 下才输出 ANSI 颜色并"
            echo "  接受 stdin 指令；管道模式已实测**无色且指令无响应**。无 PTY 时面板自动降级为"
            echo "  无色模式并在界面告警，但玩家列表 / 广播 / 踢人这类功能依赖指令通道，"
            echo "  在确认 PTY 可用前**不可用**。"
            echo "- **GameMode 映射为推断值**。除 \`1=Harmless\` 经实测外，其余取值未逐个验证。"
            echo "- **停止时存档是否落盘尚无定论**。实测中 \`/stop\` 与 Ctrl+C 均无效，"
            echo "  只有 SIGTERM 能在超时内终止进程；但两次落盘观测相互矛盾。"
            echo "  面板保留「启动前强制备份」策略作为兜底。"
            echo "- **Dockerfile 未经构建验证**（容器化部署请自行验证后再上生产）。"
            echo
            echo "详见 \`docs/验证报告.md\`（结论按 A/B/C/D 分级）。"
            echo
            echo "## 本次变更"
            echo
            if [ -n "$prev" ]; then
              echo "自 \`${prev}\` 以来的提交："
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${range}"
              echo
              echo
              echo "完整对比：https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${version}"
            else
              echo "首次发布，无前序 tag 可对比。"
              echo
              echo "完整提交记录：https://github.com/${GITHUB_REPOSITORY}/commits/${version}"
            fi
            echo
            echo "---"
            echo
            echo "构建于 ${short_sha} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > RELEASE_NOTES.md

          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: Upload build artifact
        # Only main and tags keep artifacts; PR runs verify without storing 16 MB.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: scnetm-linux-amd64-${{ github.sha }}
          path: |
            dist/scnetm-linux-amd64
            dist/scnetm-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # ---- Release -----------------------------------------------------------
      # `tag_name` is passed EXPLICITLY and is load-bearing.
      #
      # action-gh-release defaults tag_name to github.ref_name. On a push to
      # main that is "main", so the release would be attached to the branch and
      # no release would appear under the version tag — the exact symptom of
      # "the release never gets created" this workflow exists to prevent.
      - name: Create release
        if: needs.release.outputs.created == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag || github.ref_name }}
          name: ${{ needs.release.outputs.tag || github.ref_name }}
          files: |
            dist/scnetm-linux-amd64
            dist/scnetm-linux-amd64.tar.gz
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
          # Do NOT set generate_release_notes — it would append a PR-derived
          # section that is always empty here (header note 3).
          fail_on_unmatched_files: true